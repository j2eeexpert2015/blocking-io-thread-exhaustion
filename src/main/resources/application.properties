# Server Configuration
server.port=8080

# Enable virtual threads for web requests (Spring Boot 3.2+)
spring.threads.virtual.enabled=true

# Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.server.port=8080

# Logging Configuration
logging.level.com.example.demo=INFO
logging.level.org.springframework.web=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg - [%thread]%n

# Tomcat Configuration for demonstrating thread behavior
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.max-connections=8192

# Application Information
info.app.name=Blocking IO Thread Exhaustion Demo
info.app.description=Demonstration of platform threads vs virtual threads performance
info.app.version=1.0.0